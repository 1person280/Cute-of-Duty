[package]
name = "cute_of_duty_host"
version = "0.14.0"
edition = "2021"
license = "GPL-3.0-with-linking-exception"
authors = ["B站@3493264141322312", "Kimi AI Collaborator"]
description = "Cute Of Duty 客户端（渲染表现层：消费服务端权威快照，用本地稳定资源绘制）"

[dependencies]
# 双端共享契约：仅引入线格式类型（快照/上行/资源）用于反序列化服务端结果，
# 不含任何服务端模拟逻辑——即「服务端算、客户端显示」。
cute_of_duty_contract = { path = "../ContractCode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "time", "macros", "net", "io-util", "rt"] }
# 渲染表现层：本地稳定冷资源（体素几何/配色）绘制服务端快照驱动的画面。
# 0.15 版本（小步升级首站）：自 0.14 起逐版推进，避免 0.14→0.19 一次性大跳导致
# 大规模崩溃。本步只迁移 0.15 的**强制破坏项**，即不迁就编译不过的改动：
#   - 文本 API：`TextBundle`/`TextStyle` 已删除 → `Text` + `TextFont` + `TextColor`
#     （统一经 `flow::text()` 适配层生成）
#   - `Style` 类型改名 `Node`、`NodeBundle.style` 字段改名 `node`（同属强制项）
#   - `SpatialBundle` 被移除 → `Transform` + `Visibility`（自动补齐 GlobalTransform/
#     InheritedVisibility/ViewVisibility 等 require 组件）
#   - `PbrBundle` 字段类型改为 `Mesh3d`/`MeshMaterial3d<M>`，`ZIndex` 改元组结构
#   - `Window.cursor` → `Window.cursor_options`、`UiImage` → `ImageNode`、
#     `Time::delta_seconds/elapsed_seconds` → `delta_secs/elapsed_secs`、
#     `Gizmos::sphere` 去旋转参数
# 已于 0.12.4 迁移完毕：`NodeBundle`/`PbrBundle`/`Camera3dBundle`/`DirectionalLightBundle`/
# `PointLightBundle`/`ButtonBundle` 六类弃用 Bundle（91 处构造点 / 17 文件）全部改为
# required-components 新写法（直接 spawn 组件元组），构建期弃用告警 276 → 0。
#
# 注意：不启用 dynamic_linking（bevy_dylib.dll 动态装载）。实测本机 MinGW(GNU)
# 工具链下 bevy_dylib 链接报 `export ordinal too large: 242786` —— Windows PE 导出
# 序数 16 位上限 65535，而 bevy 导出的全部符号约 24 万超出该硬限制。此路需 MSVC
# 工具链才能走通，故按预案回退为静态链接；launcher 模块收敛目标不受影响。
bevy = { version = "0.15" }

[[bin]]
name = "cod1"
# 源码直接置于包根（不嵌套 src/，Code 已含「代码」之义），显式声明入口
path = "main.rs"