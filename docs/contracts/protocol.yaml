# =============================================================================
# Cute Of Duty · 线格式契约（machine-readable contract）
# =============================================================================
# 状态：草案 v0.14.0 —— 【尚不是权威源】
#   本文件目前是「手工整理的意图」，权威实现已随 0.12.2 契约拆分迁至 ContractCode/net/protocol.rs。
#   权威源反转（YAML 为准、代码由 YAML 校验）是后续独立任务，见 docs/barek-history.md。
#
# 统一版本号 x.y.z（协议 = 游戏 = 发布号，与 CONTRIBUTING 第六节一致）：
#   x+1 = 游戏内核严重破坏（老客户端整体不可用），y、z 归零
#   y+1 = 协议不兼容（删字段/改语义/改类型），z 归零，必须附迁移指南（写入 docs/barek-history.md）
#   z+1 = 无兼容性变化的细节（加性/修 bug/造型），老端必须能忽略新字段继续运行
#
# 变更纪律：
#   1. 字段只增不减、语义不可改；删字段/改语义 = y+1。
#   2. 每次改动必须同步 docs/barek-history.md 一条记录。
#   3. L2 及以上模块（net / 契约层）的改动需 ≥2 名 reviewer，maintainer 必须参与。
# =============================================================================

contract: protocol
version: 0.14.3
status: draft
owner_module: ContractCode/net
authoritative_impl: ContractCode/net/protocol.rs
compat:
  previous: 0.13.0
  breaking: true
  migration_guide: |
    新增下行变体 `ServerMessage::WorldCatalog`（服务端权威的干员名册 + 活动地图布局），**线格式不兼容**：
    `WIRE_VERSION` 13 → 14，老客户端连新服务端将在首条绑定包因版本号不符而断开。
    迁移步骤：
      1. 服务端：`ContractCode/net/packet.rs` 的 `WIRE_VERSION` 置 14；`codec::encode_server` 把
         `WorldCatalog` 编为控制类数据流（`DataKind::Control` + JSON），与既有变长控制消息同路；
         连接建立后一次性下发该消息（静态冷数据，不进每帧快照通道）。
      2. 客户端：升级 `WIRE_VERSION` 至 14；新增 `ServerMessage::WorldCatalog` 分支，把名册与地图
         布局存入本地资源（`flow::WorldCatalog`），场景/HUD 改读该资源而不再直读契约静态表
         （`operator::roster()` / `map::lawn::layout()`）；未识别的老客户端无法解析该 JSON 变体，故必须同步升级。
      3. 浏览器骨架页（`ServerCode/net/web/portal.html`）的绑定包版本号同步置 14。
    契约类型同步：`OperatorDef`/`SkillDef`/`SkillKind`/`SkillEffect` 与 `MapLayout`/`Prop`/`GlowSpec`/
    `TargetSpec`/`StationSpec`/`PickupSpec`/`Motion` 新增 `Serialize/Deserialize`，其中标签/名称字段由
    `&'static str` 改为 owned `String`（`ROSTER` 由 `const` 改为 `LazyLock`）。
    老端处置：老客户端需同步升级到 0.14.0 才能与新服务端互通。

# -----------------------------------------------------------------------------
# 传输层：小定长包 + 指令优先组包 + 双通道（0.12.0 起取代统一 64KB 槽帧）
# -----------------------------------------------------------------------------
transport:
  authoritative_impl: ContractCode/net/packet.rs
  channels:
    # 两条通道各自固定包长，**不合并数据包**；同一监听端口由首条绑定包区分角色。
    control:
      packet_bytes: 256          # 恒定 256B = 32B 头 + 7×32B 单元
      unit_bytes: 32
      units_per_packet: 7
      payload_bytes: 224
      scheduler: ContractCode/net/scheduler.rs   # 指令优先：装满 7 指令再发数据切片
    resource:
      packet_bytes: 4096         # 恒定 4096B = 32B 头 + 4064B 负载
      payload_bytes: 4064
      stream: ContractCode/net/stream.rs # 单份资源跨多包分片 + 收侧重组
  carriers:
    # 同一 256B/4096B 包格式可经不同传输载体承载，**包内语义零变化**（见 ADR 0007）。
    # 换载体不改 wire_version：浏览器端与原生端收发的是同一批定长包，服务端协议解析零改动复用。
    tcp: 原生客户端（默认 127.0.0.1:8888；同端口按首条绑定包分角色）
    websocket: 浏览器（ServerCode/net/web 桥；RFC6455 二进制帧承载同一批定长包；HTTP 门户 8080 / HTTPS 8443）
  bind:
    packet_bytes: 256            # 首条绑定包恒 256B
    sub_kind: 场景角色           # 0=Control（此后 256B）1=Resource（此后 4096B）
    payload: 玩家档案名（UTF-8）  # 资源连接凭此关联控制连接的 conn_id
  header:
    bytes: 32
    magic: 0x434F4431            # "COD1"
    wire_version: 14             # 与协议 y 位对齐（0.14 = 小定长包世代 + 服务端预设/世界目录）
    header_layout:               # (offset, width, little-endian)
      - { offset: 0,  width: 4, name: magic }
      - { offset: 4,  width: 2, name: version }
      - { offset: 6,  width: 1, name: kind,       doc: 0=Bind 1=Command 2=Data 3=Resource 4=ResourceEnd }
      - { offset: 7,  width: 1, name: flags,      doc: bit0 = continuation（数据/资源跨包分片） }
      - { offset: 8,  width: 1, name: unit_count, doc: 本包单元数 1..=7（仅 Command） }
      - { offset: 9,  width: 1, name: sub_kind,   doc: Bind=角色 / Data=DataKind / Resource=ResourceKind }
      - { offset: 10, width: 1, name: region,     doc: 0=InUse 1=Prefetch（仅 Resource） }
      - { offset: 11, width: 1, name: reserved }
      - { offset: 12, width: 2, name: chunk_index, doc: 资源分片序号（仅 Resource） }
      - { offset: 14, width: 2, name: payload_len }
      - { offset: 16, width: 8, name: seq,        doc: 包序号（单调递增） }
      - { offset: 24, width: 8, name: key,        doc: 资源/消息键（FNV-1a；0=无） }
  kinds: [Bind, Command, Data, Resource, ResourceEnd]
    # Bind       ：首条绑定包（恒 256B），sub_kind = 角色、负载 = 档案名
    # Command    ：指令包，负载为 1..7 个自包含 32B 指令单元（二进制紧凑）
    # Data       ：数据包，sub_kind 标明 Snapshot/Event/Control，负载为某条消息字节流的 32B 切片
    # Resource   ：资源包（仅资源通道），单份资源的第 chunk_index 段（负载 ≤4064B）
    # ResourceEnd：一批资源下发完毕（客户端据此标记目录就绪）
  data_kind: [Snapshot, Event, Control]   # Control=含字符串的超长控制消息降级数据流（仍属指令类）
  region: [InUse, Prefetch]
  resource_kind: [Model, Animation]

# -----------------------------------------------------------------------------
# 上行：客户端 → 服务端
# -----------------------------------------------------------------------------
uplink:
  ClientMessage:
    # TODO(核对): 下列 variant 清单只覆盖本次变更涉及项，需与 protocol.rs 全量对齐
    variants:
      - name: Input
        fields:
          - { name: player, type: PlayerInput, required: true }
      - name: LootTransfer            # 0.8.0 新增（Additive→但因字段type变更整体为 breaking）
        added_in: 0.8.0
        fields:
          - { name: target, type: u64,  required: true, doc: 容器实体 ID }
          - { name: dir,    type: TransferDir, required: true, doc: 转移方向 }
          - { name: index,  type: usize, required: true, doc: 活动侧的格位下标 0..12 }
      - name: PoolSync                # 0.12.0 新增
        added_in: 0.12.0
        doc: 客户端对象池淘汰上报（经**主通道**256B 小包；二进制紧凑，每单元最多 3 个键、可跨单元）
        fields:
          - { name: region,  type: u8,  required: true, doc: 0=在用区 1=预取区 }
          - { name: evicted, type: "Vec<u64>", required: true, doc: 被淘汰的资源键；服务端据常驻集合移除 }

  PlayerInput:
    fields:
      - { name: seq,           type: u64,  doc: 自增序号，服务端据此丢弃乱序 }
      - { name: move_forward,  type: bool }
      - { name: move_backward, type: bool }
      - { name: move_left,     type: bool }
      - { name: move_right,    type: bool }
      - { name: sprint,        type: bool }
      - { name: aim,           type: bool, doc: 按住右键越肩瞄准 }
      - { name: shoot,         type: bool }
      - { name: reload,        type: bool }
      - { name: skill_q,       type: bool }
      - { name: skill_e,       type: bool }
      - { name: weapon_slot,   type: "Option<u8>", doc: 0/1，与干员解耦 }
      - name: use_slot         # 0.8.0 新增
        type: "Option<u8>"
        added_in: 0.8.0
        doc: 背包格位下标；按 ItemCategory 语义由客户端轮盘决定，服务端按该格内容裁决效果
      - { name: aim_yaw,   type: f32 }
      - { name: aim_pitch, type: f32 }
      - name: grenade_cancel          # 0.9.0 新增
        type: bool
        added_in: 0.9.0
        serde_default: true
        doc: 持雷态下按 Esc 取消投掷并放回背包；未持雷时无副作用
    removed_fields:                # 0.8.0 删除 —— 老客户端编译期即失败
      - { name: use_medkit,  removed_in: 0.8.0, replaced_by: use_slot }
      - { name: use_grenade, removed_in: 0.8.0, replaced_by: use_slot }

# -----------------------------------------------------------------------------
# 下行：服务端 → 客户端
# -----------------------------------------------------------------------------
downlink:
  EntitySnapshot:
    changed_in: 0.8.0
    fields:
      - { name: entity_id,   type: u64 }
      - { name: hp,          type: f32 }
      - { name: armor,       type: f32 }
      - { name: skill_cd_q,  type: f32 }
      - { name: skill_cd_e,  type: f32 }
      - { name: operator_id, type: u32 }
      - name: backpack               # 0.8.0 新增
        type: "Option<Vec<Option<LootItem>>>"
        added_in: 0.8.0
        doc: 本人 12 格背包（4×3）；他人为 None（不入下行体积）
      - name: container              # 0.8.0 新增
        type: "Option<Vec<Option<LootItem>>>"
        added_in: 0.8.0
        doc: 物资箱 12 格容器内容；非容器实体为 None
      - name: held_grenade           # 0.9.0 新增
        type: "Option<ElementType>"
        added_in: 0.9.0
        doc: 该实体当前持有的手雷元素类型；未持雷为 None。客户端据此强制越肩并显示持雷提示
      - name: ammo_reserve           # 0.11.0 新增（同版本移除 ammo_pool）
        type: i32
        added_in: 0.11.0
        doc: 权威备用弹药总量 = 背包内全部弹药堆合计（-1=非玩家）。备弹唯一宿主是背包格位，
             换弹直接从背包抽弹补满弹夹；HUD「备用」读本字段（不再有换弹后归零的瞬时池）
    # TODO(核对): 其余既有字段（位置/朝向/model_preset/interact 等）待与 protocol.rs 对齐后补全
    removed_fields:
      - { name: medkit,  removed_in: 0.8.0, replaced_by: backpack }
      - { name: grenade, removed_in: 0.8.0, replaced_by: backpack }
      - { name: ammo_pool, removed_in: 0.11.0, replaced_by: ammo_reserve }   # 中间弹池已移除

  ServerMessage:
    # TODO(核对): 下列变体清单仅覆盖本次变更涉及项，需与 protocol.rs 全量对齐
    variants:
      - name: Handshake
      - name: Snapshot
      - name: Event
      - name: Pong
      - name: PresetCatalog           # 0.13.0 新增
        added_in: 0.13.0
        doc: 连接时一次性下发选装预设目录，供仓库浮层一键选用；内容归服务端权威，客户端不内嵌预设数据。
             静态冷数据，经控制类数据流（DataKind::Control + JSON）下发，不进每帧快照通道
        fields:
          - { name: presets, type: "Vec<LoadoutPreset>", required: true, doc: 预设清单（全局固定） }
      - name: WorldCatalog            # 0.14.0 新增
        added_in: 0.14.0
        doc: 握手后一次性下发干员名册 + 活动地图布局；内容归服务端权威（单一事实来源），客户端不再直读静态表。
             静态冷数据，经控制类数据流（DataKind::Control + JSON）下发，不进每帧快照通道
        fields:
          - { name: roster, type: "Vec<OperatorDef>", required: true, doc: 干员名册（顺序即切换台展示顺序） }
          - { name: layout, type: MapLayout,          required: true, doc: 活动地图布局（地板/props/发光件/站点等静态层） }
      - name: ReturnToMenu
      - name: ModelCatalog          # 0.10.0 新增
        added_in: 0.10.0
        doc: 握手后一次性下发体素模型目录（几何骨/盒 + 动画 clip 表达式），供客户端渲染本人干员模型；
             静态数据，仅在连接时发送一次，不进每帧快照
        fields:
          - { name: models,     type: "Vec<VoxelModelSpec>",     required: true, doc: "体素模型几何（骨/盒/枢轴）；盒含可选 mat 材质键（语义名，客户端据此逐盒取色）" }
          - { name: animations, type: "Vec<VoxelAnimationSpec>", required: true, doc: 体素动画 clip（骨名 → 旋转表达式） }

# -----------------------------------------------------------------------------
# 共享值类型
# -----------------------------------------------------------------------------
types:
  LootItem:
    owner_module: ContractCode/items
    fields:
      - { name: label, type: String,     doc: 展示名（唯一文案来源，UI 与补给选项共用） }
      - { name: kind,  type: PickupKind }
  LoadoutPreset:                  # 0.13.0 新增
    owner_module: ContractCode/net
    doc: 一套选装预设：显示名 + 携带物资名清单（服务端权威下发，供仓库浮层一键选用）
    fields:
      - { name: name,  type: String,        doc: 预设显示名（如「标准」「生存」「爆破」） }
      - { name: items, type: "Vec<String>", doc: 携带物资名清单，与 ClientMessage::Loadout 的 carried 同口径 }
  OperatorDef:                    # 0.14.0 起随 WorldCatalog 过线
    owner_module: ContractCode/operator
    doc: 干员档案（名册一项）：身份/展示字段 + Q/E 技能定义；服务端权威下发，客户端只展示
    fields:
      - { name: id,       type: String,      doc: 干员标识（稳定英文 id） }
      - { name: name,     type: String,      doc: 干员名（HUD 与切换台展示） }
      - { name: title,    type: String,      doc: 定位（突击手/控场手…） }
      - { name: element,  type: ElementType, doc: 元素亲和：决定技能元素与角色表现色 }
      - { name: passive,  type: String,      doc: 被动描述（展示用） }
      - { name: q,        type: SkillDef,    doc: Q 技能定义 }
      - { name: e,        type: SkillDef,    doc: E 技能定义 }
  MapLayout:                      # 0.14.0 起随 WorldCatalog 过线
    owner_module: ContractCode/map
    doc: 一张地图的完整描述（静态层）：渲染层据此生成地板/props/发光件，服务端据 targets 生成权威靶
    fields:
      - { name: name,         type: String,          doc: 地图名 }
      - { name: half_extent,  type: f32,             doc: 正方形场地半径（米） }
      - { name: floor_tile,   type: f32,             doc: 棋盘格地面边长 }
      - { name: player_spawn, type: "[f32; 3]",      doc: 出生点世界坐标 }
      - { name: props,        type: "Vec<Prop>",     doc: 静态物体（掩体/立柱/标线/装饰） }
      - { name: targets,      type: "Vec<TargetSpec>", doc: 训练靶（静态或移动） }
      - { name: pickups,      type: "Vec<PickupSpec>", doc: 场上拾取物 }
      - { name: glows,        type: "Vec<GlowSpec>",  doc: 发光件（灯带/信标/光垫） }
      - { name: stations,     type: "Vec<StationSpec>", doc: 功能站点（补给台/干员切换台/物资箱） }
  PickupKind:
    owner_module: ContractCode/items
    exposes:
      - { fn: occupies_slot, returns: bool }
      - { fn: category,      returns: "Option<ItemCategory>" }
  ItemCategory:
    owner_module: ContractCode/items
    variants: [Consumable, Tactical]     # 3 = Consumable、4 = Tactical
  TransferDir:
    owner_module: ContractCode/items
    variants: [Take, Put]                # Take: 容器→背包; Put: 背包→容器

# -----------------------------------------------------------------------------
# 常量（跨端必须一致，禁止各自硬编码副本）
# -----------------------------------------------------------------------------
constants:
  BACKPACK_SLOTS:  12
  CONTAINER_SLOTS: 12
  GRID_COLS: 4
  GRID_ROWS: 3
  INTERACT_RANGE: 3.5

