# Web 服务权威默认配置（编译期 include_str! 嵌入，随二进制分发）
#
# 与 element_reactions.yaml 同款语义：本文件是**单一事实来源**，运行时同路径文件
# 可作为设计师热改覆盖；文件缺失时回退到本嵌入默认。改这里必须同时确认
# `config::load_web_config` 的嵌入一致性单测通过。
enabled: true

# HTTP 门户/运维 API（明文，建议仅内网或置于反向代理后）
http:
  addr: "0.0.0.0"
  port: 8080

# HTTPS（内置证书加载，不依赖反向代理）；证书由 Let's Encrypt 签发
https:
  enabled: true
  addr: "0.0.0.0"
  port: 8443
  cert_path: "certs/fullchain.pem"
  key_path: "certs/privkey.pem"

# 运维 API 鉴权：token 只从环境变量读取，**不落配置文件**
admin:
  token_env: "COD_WEB_TOKEN"

# 门户页展示文案
portal:
  title: "Cute Of Duty · 服务器门户"
  motd: "欢迎来到 Cute Of Duty"