name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # HostCode 依赖 bevy 0.14，其 alsa-sys / libudev-sys / x11-dl 等需要在
    # Linux runner 上预装系统库，否则 pkg-config 找不到 alsa.pc 而构建失败。
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libudev-dev \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxkbcommon-dev \
          libwayland-dev
    # bevy 编译体量很大，缓存 cargo 产物以显著缩短每次运行耗时。
    - name: Cache cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
